<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a160f" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <!-- Home-page defaults. Every route rewrites these at runtime through
       src/ui/PageMeta.jsx; the values here are what link scrapers see, because
       they do not run JavaScript. -->
  <title>Alpenglow Retreat</title>
  <meta name="description"
    content="Fifteen cabins on four hundred acres of pine, meadow and lakeshore. Wood fires, cedar hot tubs and one of the darkest skies in the region. Open all year." />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <link rel="canonical" href="https://alpenglow-retreat.vercel.app/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Alpenglow Retreat" />
  <meta property="og:title" content="Alpenglow Retreat" />
  <meta property="og:description"
    content="Fifteen cabins on four hundred acres of pine and meadow, an hour past the last traffic light." />
  <meta property="og:url" content="https://alpenglow-retreat.vercel.app/" />
  <meta property="og:image" content="https://alpenglow-retreat.vercel.app/og-cover.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="The Alpenglow estate at dusk, a pine ridge above the meadow" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Alpenglow Retreat" />
  <meta name="twitter:description"
    content="Fifteen cabins on four hundred acres of pine and meadow, an hour past the last traffic light." />
  <meta name="twitter:image" content="https://alpenglow-retreat.vercel.app/og-cover.jpg" />

  <!-- Fraunces for the display voice, Inter for everything else. Only the
       weights actually used; the previous build pulled in eight families. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
